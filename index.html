<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝可梦观看指南</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0;
    --r5: #d93a2b; --r4: #e98b1a; --r3: #8a8a8a; --r2: #b5b5b5; --r1: #cfcfcf;
    --game: #3b6fd4; --movie: #8e44ad; --event: #444;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #1f1f22; --text: #ececee; --muted: #9a9aa0; --line: #333338;
      --r3: #8f8f95; --r2: #66666b; --r1: #4d4d52; --event: #bbb; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h1 small { font-weight: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--text); padding: 5px 10px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--text); color: var(--bg); }
  label { cursor: pointer; user-select: none; white-space: nowrap; }
  input[type=search] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); min-width: 160px; }
  .stats { color: var(--muted); font-size: 13px; margin-top: 6px; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 12px 60px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 4px 12px; }
  .row { display: grid; grid-template-columns: 26px 64px minmax(0, 1fr) 92px 96px; gap: 4px 12px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .row.watched { opacity: .5; }
  .row.extra { border-left: 4px solid var(--event); }
  .row.extra.game { border-left-color: var(--game); }
  .row.extra.movie, .row.extra.special { border-left-color: var(--movie); }
  .num { font-variant-numeric: tabular-nums; }
  .num b { display: block; font-size: 16px; }
  .num span { color: var(--muted); font-size: 12px; }
  .title { font-weight: 600; }
  .title .en { font-weight: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; color: #fff; margin-right: 6px; vertical-align: 1px; text-transform: uppercase; letter-spacing: .03em; }
  .tag.game { background: var(--game); } .tag.movie, .tag.special { background: var(--movie); } .tag.event { background: var(--event); color: var(--bg); }
  .summary { color: var(--text); font-size: 14px; margin-top: 3px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .rating { font-size: 13px; font-weight: 700; padding: 3px 0; border-radius: 6px; text-align: center; color: #fff; }
  .rating small { display: block; font-weight: normal; font-size: 11px; opacity: .9; }
  .r5 { background: var(--r5); } .r4 { background: var(--r4); } .r3 { background: var(--r3); } .r2 { background: var(--r2); } .r1 { background: var(--r1); color: var(--text); }
  .links { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .links a { color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; text-align: center; white-space: nowrap; }
  .links a:hover { border-color: var(--text); }
  .links .na { color: var(--muted); font-size: 12px; text-align: center; }
  .imdb b { font-variant-numeric: tabular-nums; }
  .imdb span { color: var(--muted); font-size: 11px; }
  button.mark { margin-top: 2px; width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--muted); font-size: 10px; line-height: 1; cursor: pointer; }
  button.mark:hover { border-color: var(--text); color: var(--text); }
  .row.watched button.mark { background: var(--muted); border-color: var(--muted); color: var(--bg); }
  .row.bookmark { opacity: 1; box-shadow: inset 0 -3px 0 var(--r5); }
  .row.bookmark button.mark { background: var(--r5); border-color: var(--r5); color: #fff; }
  .row.next { outline: 2px solid var(--text); }
  #jumpNext { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; }
  .row { scroll-margin-top: 140px; }
  @media (max-width: 700px) {
    .row { grid-template-columns: 22px minmax(0, 1fr) 84px; }
    .row .num { grid-column: 2; grid-row: 1; display: flex; gap: 8px; align-items: baseline; }
    .row .num b { display: inline; font-size: 14px; }
    .row .body { grid-column: 1 / 3; grid-row: 2; }
    .row .rating { grid-column: 3; grid-row: 1; }
    .row .links { grid-column: 3; grid-row: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>宝可梦观看指南 <small id="seriesTitle"></small></h1>
  <div class="controls">
    <div class="seg" id="minRating">
      <button data-v="0" class="on">全部</button><button data-v="3">3分以上</button><button data-v="4">4分以上 推荐</button><button data-v="5">5分 必看</button>
    </div>
    <label><input type="checkbox" id="showExtras" checked> 电影、游戏和事件</label>
    <label><input type="checkbox" id="hideWatched"> 隐藏已看</label>
    <button id="jumpNext">跳到下一集 ↓</button>
    <input type="search" id="q" placeholder="搜索标题 / 简介">
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <p class="note">
    <b>评分：</b>5 必看 · 4 推荐 · 3 可看可不看 · 2 可跳过 · 1 跳过。4分以上的集数简介不含剧透。
    <b>#</b> 为腾讯视频集数，下方是日本原版EP集数。
    点击最后看完那一行的 ▶，即可把它及之前的所有条目标为已看（再点一次后退一条）。
    <span id="tencentNote"></span>
  </p>
  <div id="list"></div>
</main>
<script src="data/guide.js"></script>
<script>
  const G = window.GUIDE;
  const PROGRESS_KEY = "pokemon-guide-progress";
  const OLD_WATCH_KEY = "pokemon-guide-watched";
  const state = { min: 0, extras: true, hideWatched: false, q: "" };
  const LABEL = { game: "游戏", movie: "电影", special: "特别篇", event: "事件" };
  const RLABEL = { 5: "必看", 4: "推荐", 3: "可看可不看", 2: "可跳过", 1: "跳过" };

  document.getElementById("seriesTitle").textContent = G.series.map(s => `${s.titleZh} · ${s.title}`).join("，");
  document.getElementById("tencentNote").textContent = G.series.map(s => s.tencentNote).join(" ");

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const keyOf = r => r.type === "episode" ? `${r.series}:${r.jp}` : `${r.type}:${r.date}:${r.title}`;

  // Progress is a single bookmark: the key of the last watched row. Every row at or before it (timeline order) is watched.
  const indexOf = new Map(G.rows.map((r, i) => [keyOf(r), i]));
  if (localStorage.getItem(PROGRESS_KEY) == null && localStorage.getItem(OLD_WATCH_KEY)) {
    const old = new Set(JSON.parse(localStorage.getItem(OLD_WATCH_KEY)));
    const last = Math.max(-1, ...G.rows.map((r, i) => r.type === "episode" && old.has(keyOf(r)) ? i : -1));
    if (last >= 0) localStorage.setItem(PROGRESS_KEY, keyOf(G.rows[last]));
    localStorage.removeItem(OLD_WATCH_KEY);
  }
  let progress = indexOf.get(localStorage.getItem(PROGRESS_KEY)) ?? -1;
  const isWatched = i => i <= progress;
  function setProgress(i) {
    progress = i;
    i >= 0 ? localStorage.setItem(PROGRESS_KEY, keyOf(G.rows[i])) : localStorage.removeItem(PROGRESS_KEY);
    render();
  }
  const epLabel = r => `#${r.tencentNo ?? "—"} (EP${String(r.jp).padStart(3, "0")})`;

  function render() {
    const q = state.q.trim().toLowerCase();
    const rows = G.rows.map((r, i) => ({ ...r, i })).filter(r => {
      if (r.type !== "episode" && !state.extras) return false;
      if (state.min && (r.rating ?? 0) < state.min && !(r.type !== "episode" && r.rating == null && state.extras)) return false;
      if (state.hideWatched && isWatched(r.i)) return false;
      if (q && !`${r.title} ${r.titleZh} ${r.summary} ${r.japanese}`.toLowerCase().includes(q)) return false;
      return true;
    });
    const nextI = rows.find(r => !isWatched(r.i))?.i;
    document.getElementById("list").innerHTML = rows.map(r => {
      const isEp = r.type === "episode", w = isWatched(r.i);
      const num = isEp
        ? `<div class="num"><b>${r.tencentNo ?? "—"}</b><span>EP${String(r.jp).padStart(3, "0")}</span></div>`
        : `<div class="num"><span>${r.date.slice(0, 7)}</span></div>`;
      const rating = r.rating
        ? `<div class="rating r${r.rating}">${r.rating}<small>${RLABEL[r.rating]}</small></div>`
        : `<div></div>`;
      const imdb = r.imdbUrl
        ? `<a class="imdb" href="${r.imdbUrl}" target="_blank" rel="noopener">IMDb <b>${r.imdbRating ?? "?"}</b> <span>${r.imdbVotes ? (r.imdbVotes >= 1000 ? (r.imdbVotes / 1000).toFixed(1) + "k" : r.imdbVotes) : ""}</span></a>`
        : "";
      const tx = r.tencentUrl
        ? `<a href="${r.tencentUrl}" target="_blank" rel="noopener">▶ 腾讯视频</a>`
        : (isEp || r.type === "movie" || r.type === "special" ? `<span class="na">腾讯暂无</span>` : "");
      const cls = [isEp ? "" : "extra " + r.type, w ? "watched" : "", r.i === progress ? "bookmark" : "", r.i === nextI ? "next" : ""].join(" ");
      return `<div class="row ${cls}" data-i="${r.i}">
        <button class="mark" title="${r.i === progress ? "书签——点击后退一条" : "看到这里"}">▶</button>
        ${num}
        <div class="body">
          <div class="title">${isEp ? "" : `<span class="tag ${r.type}">${LABEL[r.type]}</span>`}${esc(r.titleZh || r.title)}${r.titleZh ? `<span class="en">${esc(r.title)}</span>` : ""}</div>
          <div class="summary">${esc(r.summary)}</div>
          <div class="meta">${r.date}${r.japanese ? " · " + esc(r.japanese) : ""}</div>
        </div>
        ${rating}
        <div class="links">${tx}${imdb}</div>
      </div>`;
    }).join("");
    const eps = G.rows.filter(r => r.type === "episode");
    const ahead = G.rows.filter((r, i) => !isWatched(i) && r.type === "episode");
    const top = eps.filter(r => r.rating >= 4), topAhead = ahead.filter(r => r.rating >= 4);
    const lastEp = G.rows.slice(0, progress + 1).reverse().find(r => r.type === "episode");
    const parts = [
      lastEp ? `已看到 ${epLabel(lastEp)}` : "尚未开始",
      ahead[0] ? `下一集：${epLabel(ahead[0])}` : "已全部看完",
      topAhead[0] && topAhead[0] !== ahead[0] ? `下一集4分以上：${epLabel(topAhead[0])}` : "",
      `剩余 ${ahead.length}/${eps.length} 集`,
      `4分以上剩余 ${topAhead.length}/${top.length}`,
      `显示 ${rows.length} 条`,
    ];
    document.getElementById("stats").textContent = parts.filter(Boolean).join(" · ");
  }

  document.getElementById("minRating").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.min = +b.dataset.v;
    for (const x of e.currentTarget.children) x.classList.toggle("on", x === b);
    render();
  });
  document.getElementById("showExtras").addEventListener("change", e => { state.extras = e.target.checked; render(); });
  document.getElementById("hideWatched").addEventListener("change", e => { state.hideWatched = e.target.checked; render(); });
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
  document.getElementById("list").addEventListener("click", e => {
    if (!e.target.classList.contains("mark")) return;
    const i = +e.target.closest(".row").dataset.i;
    setProgress(i === progress ? i - 1 : i);
  });
  document.getElementById("jumpNext").addEventListener("click", () => {
    const el = document.querySelector(".row.next") || document.querySelector(".row:last-child");
    el?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  render();
</script>
</body>
</html>
